name: qa_agent_flutter
description: "智能问答系统 - Flutter 跨平台版本"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 网络请求
  dio: ^5.4.3

  # 路由
  go_router: ^14.2.0

  # 本地存储
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON 序列化
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Markdown
  flutter_markdown: ^0.7.1
  flutter_highlight: ^0.7.0

  # 文件选择
  file_picker: ^8.0.3

  # 桌面窗口
  window_manager: ^0.4.0

  # 录音
  record: ^6.1.0
  permission_handler: ^11.3.0

  # 音频播放（TTS）
  audioplayers: ^6.1.0

  # 工具
  intl: ^0.19.0
  url_launcher: ^6.2.6
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
